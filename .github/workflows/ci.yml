name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Lint only — this repo is protocol documentation plus a small amount of
  # capture/dissector tooling, and carries no test suite.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Runs exactly the gates contributors get locally, from the same config.
      # The ruff pin lives in .pre-commit-config.yaml, so there is no second
      # version to keep in sync here.
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run hooks
        run: pre-commit run --all-files --show-diff-on-failure
