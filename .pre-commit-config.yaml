repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/hukkin/mdformat
    rev: 0.7.22
    hooks:
      - id: mdformat
        args: [--check]
        additional_dependencies:
          - mdformat-gfm
          - mdformat-tables
        # Only check new/changed MD files in tools-serial/ and glossary — skip
        # large protocol docs that predate the formatter and would need manual
        # review.
        files: 'protocols/midea/tools-serial/.*\.md$|serial_glossary.*\.md$'

  - repo: local
    hooks:
      - id: glossary-tests
        name: glossary tests
        entry: python3 -X utf8 protocols/midea/tools-serial/run_all_tests.py
        language: system
        pass_filenames: false
        files: '(serial_glossary|protocols/midea/tools-serial/)'
